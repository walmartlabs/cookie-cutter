    if: ${{ github.event_name == 'schedule' || ( github.event_name == 'pull_request' && ( github.base_ref == 'master' || contains(needs.smoke.outputs.commit_message, '[full ci]') || contains(needs.smoke.outputs.commit_message, '[full-ci]') ) ) }}
    needs: [test-macOS]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Ubuntu Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'yarn'
      - name: Install Yarn
        run: yarn set version 1.22.22
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Yarn Build
        run: cd packages/core && yarn build && cd ../redis && yarn build
      - name: Yarn Integrate
        run: cd packages/redis && yarn integrate

  publish-to-npm:
    name: Publish to NPM
    if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Ubuntu Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'yarn'
      - name: Install Yarn
        run: yarn set version 1.22.22
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Publish to NPM
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
              echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
              yarn build && node ./.ci/deploy.js

  publish-to-github-packages:
    name: Publish to GitHub Packages
    if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Ubuntu Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'yarn'
          registry-url: "https://npm.pkg.github.com"
          scope: "@walmartlabs"
      - name: Install Yarn
        run: yarn set version 1.22.22
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Publish to GitHub Packages
        env:
          NPM_REGISTRY: https://npm.pkg.github.com
        run: yarn build && node ./.ci/deploy.js

  publish-to-github-releases:
    name: Publish to GitHub Releases
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Ubuntu Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'yarn'
      - name: Install Yarn
        run: yarn set version 1.22.22
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Build and Pack Packages
        run: yarn build && node ./.ci/pack.js
      - name: Upload .tgz Assets to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Uploading release assets for tag: $TAG"
          for tgz in release-assets/*.tgz; do
            echo "  uploading $tgz"
            gh release upload "$TAG" "$tgz" --clobber
          done

  publish-to-github-pages:
    name: Publish to Github Pages
    if: ${{ github.event_name == 'push' && contains(github.ref, 'master') }}
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Ubuntu Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'yarn'
      - name: Install Yarn
        run: yarn set version 1.22.22
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Publish to Github Pages
        env:
          GH_NAME: sklose
          GH_EMAIL: sebastian.klose@walmart.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
              git config --global user.name "${GH_NAME}"
              git config --global user.email "${GH_EMAIL}"
              echo "machine github.com login ${GH_NAME} password ${GITHUB_TOKEN}" > ~/.netrc
              cd docs/website && yarn install && GIT_USER="${GH_NAME}" yarn run publish-gh-pages
