  publish-to-npm:
    name: Publish to NPM
    if: ${{ github.event_name == 'push' }}
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Publish to NPM
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
              echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
              bun run build && bun ./.ci/deploy.js

  publish-to-github-pages:
    name: Publish to Github Pages
    if: ${{ github.event_name == 'push' && contains(github.ref, 'master') }}
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Publish to Github Pages
        env:
          GH_NAME: sklose
          GH_EMAIL: sebastian.klose@walmart.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
              git config --global user.name "${GH_NAME}"
              git config --global user.email "${GH_EMAIL}"
              echo "machine github.com login ${GH_NAME} password ${GITHUB_TOKEN}" > ~/.netrc
              cd docs/website && bun install && GIT_USER="${GH_NAME}" bun run publish-gh-pages
