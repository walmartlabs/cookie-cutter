name: Cookie Cutter Build Workflow Develop

on:
  push:
    branches: [ develop, 'release/**']
  pull_request:
    branches: [ develop, 'release/**' ]
  schedule:
    - cron:  '0 4 * * *'

jobs:
  smoke:
    name: Ubuntu Node 16 Smoke
    runs-on: ubuntu-latest
    outputs:
      commit_message: ${{ steps.output_message.outputs.commit_message }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
        with: # required for git log to access the correct commits
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Get Commit Message
        run: echo "COMMIT_MESSAGE=$(git log --format=oneline -n 1 ${{ github.event.after }})" >> $GITHUB_ENV
      - name: Set Output Commit Message
        id: output_message
        env:
          COMMIT_MESSAGE: ${{ env.COMMIT_MESSAGE }}
        run: |
              echo "::set-output name=commit_message::$COMMIT_MESSAGE"
              echo Commit Message: "$COMMIT_MESSAGE"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Bun Build
        run: bun run build
      - name: Bun Lint
        run: bun run lint
      - name: Bun Test
        run: bun run test
      - name: Bun Audit
        if: ${{ github.event_name == 'schedule' }}
        run: bun audit
        # run: /bin/bash -c 'bun audit; [[ $? -ge 8 ]] && exit 1 || exit 0'

  master-audit:
    name: Ubuntu Master Audit
    runs-on: ubuntu-latest
    outputs:
      commit_message: ${{ steps.output_message.outputs.commit_message }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
        with: # required for git log to access the correct commits
          ref: master
      - name: Setup Bun
        if: ${{ github.event_name == 'schedule' }}
        uses: oven-sh/setup-bun@v1
      - name: Install Dependencies
        if: ${{ github.event_name == 'schedule' }}
        run: bun install --frozen-lockfile
      - name: Bun Audit
        if: ${{ github.event_name == 'schedule' }}
        run: bun audit

