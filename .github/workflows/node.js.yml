name: Cookie Cutter Build Workflow Develop

on:
  push:
    branches: [ develop, 'release/**']
    tags: [ 'v*' ]
  pull_request:
    branches: [ develop, 'release/**' ]
  schedule:
    - cron:  '0 4 * * *'

jobs:
  smoke:
    name: Ubuntu Node 24 Smoke
    runs-on: ubuntu-latest
    outputs:
      commit_message: ${{ steps.output_message.outputs.commit_message }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with: # required for git log to access the correct commits
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Get Commit Message
        run: echo "COMMIT_MESSAGE=$(git log --format=oneline -n 1 ${{ github.event.after }})" >> $GITHUB_ENV
      - name: Set Output Commit Message
        id: output_message
        env:
          COMMIT_MESSAGE: ${{ env.COMMIT_MESSAGE }}
        run: |
              echo "commit_message=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
              echo Commit Message: "$COMMIT_MESSAGE"
      - name: Setup Ubuntu Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'yarn'
      - name: Install Yarn
        run: yarn set version 1.22.22
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Yarn Build
        run: yarn build
      - name: Yarn Lint
        run: yarn lint
      - name: Yarn Test
        run: yarn test
      - name: Yarn Audit
        if: ${{ github.event_name == 'schedule' }}
        run: yarn audit
        # run: /bin/bash -c 'yarn audit; [[ $? -ge 8 ]] && exit 1 || exit 0'

  master-audit:
    name: Ubuntu Master Audit
    runs-on: ubuntu-latest
    outputs:
      commit_message: ${{ steps.output_message.outputs.commit_message }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with: # required for git log to access the correct commits
          ref: master
      - name: Setup Ubuntu Node 24
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'yarn'
      - name: Install Yarn
        if: ${{ github.event_name == 'schedule' }}
        run: yarn set version 1.22.22
      - name: Install Dependencies
        if: ${{ github.event_name == 'schedule' }}
        run: yarn install --frozen-lockfile
      - name: Yarn Audit
        if: ${{ github.event_name == 'schedule' }}
        run: yarn audit

